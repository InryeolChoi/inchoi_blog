{{define "layout"}}<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  /* 지금은 최소한만. 디자인은 나중에 따로 다듬는다. */
  :root { color-scheme: light dark; }
  body {
    max-width: 46rem; margin: 2rem auto; padding: 0 1rem;
    font: 16px/1.7 -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif;
  }
  nav.trail { font-size: .875rem; margin-bottom: 1.5rem; }
  nav.trail a { color: inherit; }
  h1 { font-size: 1.6rem; line-height: 1.3; }
  ul.list { list-style: none; padding: 0; }
  ul.list li { padding: .35rem 0; border-bottom: 1px solid rgba(128,128,128,.2); }
  .count, .status { font-size: .8rem; opacity: .6; }
  .cover { font-size: .75rem; border: 1px solid rgba(128,128,128,.4); border-radius: .2rem; padding: 0 .3rem; }
  article img { max-width: 100%; height: auto; }
  article pre { overflow-x: auto; padding: .8rem; background: rgba(128,128,128,.12); border-radius: .3rem; }
  article code { font-size: .9em; }
  article :not(pre) > code { background: rgba(128,128,128,.15); padding: .1em .3em; border-radius: .2rem; }
  article blockquote { margin-left: 0; padding-left: 1rem; border-left: 3px solid rgba(128,128,128,.4); }
  article table { border-collapse: collapse; display: block; overflow-x: auto; }
  article th, article td { border: 1px solid rgba(128,128,128,.35); padding: .3rem .6rem; }
  /* 수식은 아직 서버에서 그리지 않는다. 원문 LaTeX가 그대로 보인다. */
  .math { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: rgba(120,170,255,.13); }
  .math-display { display: block; padding: .6rem; margin: 1rem 0; white-space: pre-wrap; overflow-x: auto; }
  footer { margin-top: 3rem; font-size: .8rem; opacity: .6; }
</style>
</head>
<body>
<nav class="trail">
  <a href="/">홈</a>
  {{- range .Trail}} / <a href="{{.URL}}">{{.Name}}</a>{{end}}
</nav>
{{template "content" .}}
<footer>읽기 전용 미리보기 · status 구분 없이 전부 노출</footer>
</body>
</html>{{end}}
