{{define "login"}}<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>로그인 · 열렬히.뛰기</title>
{{/* 공개 페이지와 같은 스타일시트다. 로그인 화면만 남의 집처럼 보이지 않게. */}}
<style>{{.SiteCSS}}</style>
<style>
  .lg-wrap {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
  }
  .lg-box {
    width: 100%;
    max-width: 26rem;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--surface);
    padding: 2rem 1.75rem;
  }
  .lg-kicker {
    font-size: .78rem;
    letter-spacing: .08em;
    text-transform: uppercase;
    color: var(--ink-dim);
    margin: 0 0 .6rem;
  }
  .lg-box h1 { font-size: 1.35rem; margin: 0 0 .5rem; }
  .lg-box p { color: var(--ink-dim); margin: 0 0 1.5rem; line-height: 1.6; }
  .lg-btn {
    display: block;
    text-align: center;
    padding: .8rem 1rem;
    border-radius: 10px;
    border: 1px solid var(--line);
    text-decoration: none;
    font-weight: 600;
    color: var(--ink);
  }
  .lg-btn:hover, .lg-btn:focus-visible { border-color: var(--rail); }
  .lg-err {
    border: 1px solid var(--line);
    border-left: 3px solid var(--rail);
    border-radius: 8px;
    padding: .7rem .9rem;
    margin: 0 0 1.25rem;
    font-size: .9rem;
    color: var(--ink);
    line-height: 1.55;
  }
  .lg-foot { margin: 1.5rem 0 0; font-size: .82rem; }
</style>
</head>
<body>
<div class="lg-wrap">
  <main class="lg-box">
    <p class="lg-kicker">열렬히 · 뛰기</p>
    <h1>글쓰기 화면</h1>
    {{if .Error}}<p class="lg-err">{{.Error}}</p>{{end}}
    <p>이 화면은 주인만 쓴다. GitHub으로 확인한다.</p>
    <a class="lg-btn" href="/admin/auth/start">GitHub으로 로그인</a>
    <p class="lg-foot"><a href="/">← 블로그로 돌아가기</a></p>
  </main>
</div>
</body>
</html>
{{end}}
