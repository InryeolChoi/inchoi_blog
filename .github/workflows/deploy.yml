# main에 push되면 빌드해서 playground 인스턴스에 바이너리만 올린다.
#
# **DB는 절대 건드리지 않는다.** blog.db가 정본이고 앞으로 admin 화면이 거기에
# 글을 쓴다. CI가 DB를 올리면 그때까지 쓴 글이 통째로 사라진다. 인스턴스의
# /var/lib/blog/blog.db는 사람이 한 번 올려두고 그 뒤로는 서버만 만진다.
name: deploy

on:
  push:
    branches: [main]
  # 코드가 안 바뀌었는데 다시 올리고 싶을 때(인스턴스를 새로 만든 뒤 등)
  workflow_dispatch:

# 배포 두 개가 겹치면 뒤엣것이 앞엣것의 바이너리를 덮는다. 줄을 세우되
# 취소하지는 않는다 — 중간에 끊긴 배포는 어떤 상태인지 알 수 없다.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  PROJECT_ID: statcode
  ZONE: us-west1-a
  INSTANCE: playground

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # go.mod의 버전을 그대로 쓴다. 여기에 숫자를 또 적으면 둘이 갈라진다.
          go-version-file: go.mod
          cache: true

      # 깨진 것을 올리지 않는다. 이 저장소의 완료 기준이기도 하다.
      - name: 테스트
        run: go test ./...

      # CGO 없이 정적으로 빌드한다(modernc.org/sqlite가 순수 Go라 가능하다).
      # 인스턴스는 Intel Broadwell이라 amd64다.
      - name: 빌드
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags="-s -w" -o blog ./cmd/blog
          ls -l blog

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      # IAP 터널로 보낸다. 인스턴스에 외부 IP가 있긴 하지만, 22번을
      # 0.0.0.0/0에 여는 대신 allow-iap-ssh(35.235.240.0/20)만 쓰는 쪽이 낫다.
      - name: 바이너리 전송
        run: |
          gcloud compute scp blog "${INSTANCE}:/tmp/blog.new" \
            --zone="$ZONE" --project="$PROJECT_ID" \
            --tunnel-through-iap --quiet

      # /opt/blog 안에서 rename으로 갈아끼운다. **같은 파일시스템이라 원자적이고,
      # 실행 중인 바이너리를 rename으로 덮는 것은 리눅스에서 허용된다**
      # (ETXTBSY는 open(O_WRONLY)에서 나지 rename에서 나지 않는다).
      # /tmp에서 곧장 mv하면 파일시스템이 달라 rename이 아니라 복사가 되고,
      # 그 사이에 반쯤 쓰인 파일이 실행될 수 있다.
      - name: 설치와 재시작
        run: |
          gcloud compute ssh "$INSTANCE" \
            --zone="$ZONE" --project="$PROJECT_ID" \
            --tunnel-through-iap --quiet \
            --command='set -euo pipefail
              sudo install -o root -g root -m 0755 /tmp/blog.new /opt/blog/blog.incoming
              sudo mv /opt/blog/blog.incoming /opt/blog/blog
              rm -f /tmp/blog.new
              sudo systemctl restart blog
              sudo systemctl is-active blog'

      # 재시작만 확인하면 부족하다. 마이그레이션이나 DB 때문에 뜨자마자
      # 죽는 경우가 있어서, 실제로 페이지가 나오는지 본다.
      - name: 살아 있는지 확인
        run: |
          gcloud compute ssh "$INSTANCE" \
            --zone="$ZONE" --project="$PROJECT_ID" \
            --tunnel-through-iap --quiet \
            --command='set -euo pipefail
              for i in $(seq 1 15); do
                if curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1/; then
                  exit 0
                fi
                sleep 2
              done
              echo "서버가 응답하지 않는다" >&2
              sudo journalctl -u blog -n 50 --no-pager >&2
              exit 1'
