# /etc/systemd/system/caddy.service.d/limits.conf
#
# Caddy는 apt 패키지가 가져온 제 유닛(/lib/systemd/system/caddy.service)을
# 그대로 쓴다. **그 파일을 고치지 않는다** — 패키지를 올릴 때 덮여서 갈라진다.
# 여기 drop-in으로 이 기계에만 해당하는 것을 덧붙인다.
[Service]
# 1GB짜리 e2-micro다. blog가 384M/512M을 쓰고 있어서, 여기서 새면
# 둘이 같이 죽고 SSH까지 못 들어간다. Caddy는 평소 30~50MB면 된다.
MemoryHigh=128M
MemoryMax=192M
